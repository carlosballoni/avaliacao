<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Avaliação</title>

  <!-- CSS rápido no próprio arquivo -->
  <style>
    body      { margin:0; font-family:sans-serif; background:#eaf3ff;
                display:flex; justify-content:center; align-items:center; height:100vh; }
    .box      { background:#fff; padding:40px; border-radius:8px;
                box-shadow:0 4px 8px rgba(0,0,0,.1); max-width:600px; width:100%; }
    input,textarea { width:100%; padding:10px; margin:8px 0;
                     border:1px solid #ccc; border-radius:4px; font-size:1rem; }
    button    { padding:12px 24px; background:#512da8; color:#fff;
                border:none; border-radius:4px; font-size:1rem; cursor:pointer; }
    button:hover { background:#311b92; }
  </style>

  <!-- EmailJS (opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
  <script>
    (function(){ emailjs.init('SEU_USER_ID_EMAILJS'); })();

    function sendEmail(e){
      e.preventDefault();
      const params = {
        from_name : document.getElementById('name').value,
        email_id  : document.getElementById('email').value,
        message   : document.getElementById('message').value
      };
      emailjs
        .send('SEU_SERVICE_ID','SEU_TEMPLATE_ID',params)
        .then(()=>alert('Mensagem enviada!'))
        .catch(err=>alert('Erro: '+err));
    }
  </script>
</head>

<body>
  <form class="box" onsubmit="sendEmail(event)">
    <h1>Formulário de Avaliação</h1>

    <label for="name">Nome</label>
    <input id="name" required>

    <label for="email">E-mail</label>
    <input id="email" type="email" required>

    <label for="message">Mensagem</label>
    <textarea id="message" rows="5" required></textarea>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
