<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D Bauna – Avaliação de Treinamento</title>

  <!-- React 18 + Babel para JSX direto no browser -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function FormularioTreinamento() {
      const [formData, setFormData] = useState({
        nomeParticipante: '',
        dataAplicacao: '',

        // Conteúdo
        clareza: '',
        relevancia: '',
        aplicabilidade: '',

        // Metodologia
        metodologia: '',

        // PDCA (em quatro etapas)
        compreensaoPlan: '',
        compreensaoDo: '',
        compreensaoCheck: '',
        compreensaoAct: '',

        // Instrutor
        instrutor: '',

        // Resultados
        expectativas: '',
        aplicarConhecimento: '',
        recomendaria: '',

        comentarios: ''
      });

      const [loading, setLoading] = useState(false);
      const [telaObrigado, setTelaObrigado] = useState(false);

      /* ------------------------------------------------------------------
         1. Ao voltar do FormSubmit teremos ?enviado=1                     */
      useEffect(() => {
        const qs = new URLSearchParams(window.location.search);
        if (qs.get('enviado') === '1') {
          setTelaObrigado(true);
          // limpa o parâmetro para evitar que apareça no reload
          const url = new URL(window.location.href);
          url.searchParams.delete('enviado');
          window.history.replaceState({}, '', url.pathname);
        }
      }, []);

      /* ------------------------------------------------------------------
         2. Handlers                                                       */
      const handleChange = ({ target }) =>
        setFormData(prev => ({ ...prev, [target.name]: target.value }));

      const handleNativeSubmit = () => setLoading(true);

      /* ------------------------------------------------------------------
         3. Tela “Obrigado”                                                */
      if (telaObrigado) {
        return (
          <div className="flex items-center justify-center py-20">
            <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
              <svg className="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Avaliação enviada!</h2>
              <p className="text-gray-600 mb-6">Obrigado pelo seu feedback.</p>
              <button
                onClick={() => setTelaObrigado(false)}
                className="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition"
              >
                Enviar outra avaliação
              </button>
            </div>
          </div>
        );
      }

      /* ------------------------------------------------------------------
         4. URL de retorno (_next)                                         */
      const nextUrl = `${window.location.origin}${window.location.pathname}?enviado=1`;

      /* ------------------------------------------------------------------
         5. Corpo de e-mail “message”                                      */
      const emailMsg = `
D BAUNA - AVALIAÇÃO DE TREINAMENTO
GESTÃO E PDCA

Nome: ${formData.nomeParticipante}
Data do Treinamento: ${formData.dataAplicacao}

--- 1. CONTEÚDO ----------------------
Clareza: ${formData.clareza}
Relevância: ${formData.relevancia}
Aplicabilidade: ${formData.aplicabilidade}

--- 2. METODOLOGIA -------------------
Metodologia: ${formData.metodologia}

--- 3. COMPREENSÃO DO PDCA -----------
PLAN:  ${formData.compreensaoPlan}
DO:    ${formData.compreensaoDo}
CHECK: ${formData.compreensaoCheck}
ACT:   ${formData.compreensaoAct}

--- 4. INSTRUTOR ---------------------
Instrutor: ${formData.instrutor}

--- 5. RESULTADOS --------------------
Expectativas:         ${formData.expectativas}
Aplicar conhecimento: ${formData.aplicarConhecimento}
Recomendaria:         ${formData.recomendaria}

--- 6. COMENTÁRIOS -------------------
${formData.comentarios || 'Nenhum'}

Enviado em: ${new Date().toLocaleString('pt-BR')}
      `.trim();

      /* ------------------------------------------------------------------
         6. Formulário                                                    */
      return (
        <div className="py-10 px-4">
          <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
            <header className="border-b border-gray-200 pb-6 mb-6">
              <h1 className="text-3xl font-bold text-gray-800 mb-2">
                D Bauna – Avaliação de Treinamento
              </h1>
              <p className="text-lg text-indigo-600 font-semibold">Gestão e PDCA</p>
              <p className="text-gray-600 mt-2">
                Sua opinião é fundamental para aprimorarmos nossos treinamentos.
              </p>
            </header>

            <form
              action="https://formsubmit.co/el/xuyiwe"   /* <<< token gerado no FormSubmit */
              method="POST"
              onSubmit={handleNativeSubmit}
              className="space-y-8"
            >
              {/* hidden que junta tudo em texto legível */}
              <input type="hidden" name="message" value={emailMsg} />

              {/* parâmetros de controle do FormSubmit */}
              <input type="hidden" name="_subject"
                     value={`D Bauna - Avaliação - ${formData.nomeParticipante || 'Novo envio'}`} />
              <input type="hidden" name="_captcha" value="false" />
              <input type="hidden" name="_next" value={nextUrl} />

              {/* -------- 1. Informações gerais ---------------------------- */}
              <section>
                <h2 className="titulo-section">Informações Gerais</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <CampoTexto
                    label="Nome do participante *"
                    name="nomeParticipante"
                    value={formData.nomeParticipante}
                    onChange={handleChange}
                    required
                  />
                  <CampoTexto
                    type="date"
                    label="Data do treinamento *"
                    name="dataAplicacao"
                    value={formData.dataAplicacao}
                    onChange={handleChange}
                    required
                  />
                </div>
              </section>

              {/* -------- 2. Conteúdo do treinamento ----------------------- */}
              <section>
                <h2 className="titulo-section">1. Conteúdo do Treinamento</h2>
                <CampoSelect
                  label="Clareza do conteúdo *"
                  name="clareza"
                  value={formData.clareza}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Relevância do conteúdo *"
                  name="relevancia"
                  value={formData.relevancia}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Aplicabilidade prática *"
                  name="aplicabilidade"
                  value={formData.aplicabilidade}
                  onChange={handleChange}
                  required
                />
              </section>

              {/* -------- 3. Metodologia ----------------------------------- */}
              <section>
                <h2 className="titulo-section">2. Metodologia e Recursos</h2>
                <CampoSelect
                  label="Avaliação da metodologia *"
                  name="metodologia"
                  value={formData.metodologia}
                  onChange={handleChange}
                  required
                />
              </section>

              {/* -------- 4. Compreensão do PDCA --------------------------- */}
              <section>
                <h2 className="titulo-section">3. Compreensão do Ciclo PDCA</h2>
                <CampoSelect
                  label="Etapa PLAN *"
                  name="compreensaoPlan"
                  value={formData.compreensaoPlan}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Etapa DO *"
                  name="compreensaoDo"
                  value={formData.compreensaoDo}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Etapa CHECK *"
                  name="compreensaoCheck"
                  value={formData.compreensaoCheck}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Etapa ACT *"
                  name="compreensaoAct"
                  value={formData.compreensaoAct}
                  onChange={handleChange}
                  required
                />
              </section>

              {/* -------- 5. Instrutor ------------------------------------- */}
              <section>
                <h2 className="titulo-section">4. Avaliação do Instrutor</h2>
                <CampoSelect
                  label="Desempenho do instrutor *"
                  name="instrutor"
                  value={formData.instrutor}
                  onChange={handleChange}
                  required
                />
              </section>

              {/* -------- 6. Resultados ------------------------------------ */}
              <section>
                <h2 className="titulo-section">5. Resultados e Satisfação Geral</h2>
                <CampoSelect
                  label="O treinamento atendeu suas expectativas *"
                  name="expectativas"
                  value={formData.expectativas}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Preparado para aplicar o conhecimento *"
                  name="aplicarConhecimento"
                  value={formData.aplicarConhecimento}
                  onChange={handleChange}
                  required
                />
                <CampoSelect
                  label="Recomendaria o treinamento *"
                  name="recomendaria"
                  value={formData.recomendaria}
                  onChange={handleChange}
                  required
                />
              </section>

              {/* -------- 7. Comentários ----------------------------------- */}
              <section>
                <h2 className="titulo-section">6. Comentários e Sugestões</h2>
                <div className="space-y-4">
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    Comentários adicionais
                  </label>
                  <textarea
                    name="comentarios"
                    value={formData.comentarios}
                    onChange={handleChange}
                    rows="5"
                    className="campo-input"
                    placeholder="Compartilhe suas sugestões, pontos fortes do treinamento ou qualquer outro comentário..."
                  />
                </div>
              </section>

              {/* -------- Botão -------------------------------------------- */}
              <div className="pt-6 border-t border-gray-200">
                <button
                  type="submit"
                  className={`w-full ${loading ? 'bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700'} text-white py-3 px-6 rounded-lg font-semibold transition-colors shadow-lg`}
                  disabled={loading}
                >
                  {loading ? 'Enviando…' : 'Enviar Avaliação'}
                </button>
              </div>
            </form>
          </div>

          <p className="text-center text-gray-600 text-sm mt-6">
            Suas respostas são confidenciais e usadas apenas para melhoria contínua.
          </p>
        </div>
      );
    }

    /* --------------------------------------------------------------------
       7. Componentes reutilizáveis                                        */
    const opcoes = [
      'Excelente (5)',
      'Muito Bom (4)',
      'Bom (3)',
      'Regular (2)',
      'Insatisfatório (1)'
    ];

    const CampoTexto = ({
      label,
      name,
      value,
      onChange,
      type = 'text',
      required = false
    }) => (
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-2">
          {label}
        </label>
        <input
          type={type}
          name={name}
          value={value}
          onChange={onChange}
          required={required}
          className="campo-input"
        />
      </div>
    );

    const CampoSelect = ({
      label,
      name,
      value,
      onChange,
      required = false
    }) => (
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-2">
          {label}
        </label>
        <select
          name={name}
          value={value}
          onChange={onChange}
          required={required}
          className="campo-input"
        >
          <option value="">Selecione…</option>
          {opcoes.map(opt => (
            <option key={opt} value={opt}>{opt}</option>
          ))}
        </select>
      </div>
    );

    /* --------------------------------------------------------------------
       8. Estilos utilitários extras                                       */
    tailwind.config = {
      theme: {
        extend: {
          typography: false
        }
      }
    };

    /* classes Tailwind centralizadas para inputs/sections */
    const style = document.createElement('style');
    style.innerHTML = `
      .campo-input { @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent; }
      .titulo-section { @apply text-xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-indigo-500; }
    `;
    document.head.appendChild(style);

    /* --------------------------------------------------------------------
       9. Renderização do App                                              */
    ReactDOM.createRoot(document.getElementById('root')).render(<FormularioTreinamento />);
  </script>
</body>
</html>
