<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>D Bauna - Avaliação de Treinamento</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function FormularioTreinamento() {
            const [formData, setFormData] = useState({
                nomeParticipante: '',
                dataAplicacao: '',
                clareza: '',
                relevancia: '',
                aplicabilidade: '',
                metodologia: '',
                compreensaoPlan: '',
                compreensaoDo: '',
                compreensaoCheck: '',
                compreensaoAct: '',
                instrutor: '',
                expectativas: '',
                aplicarConhecimento: '',
                recomendaria: '',
                comentarios: ''
            });

            const [loading, setLoading] = useState(false);
            const [submittedLocal, setSubmittedLocal] = useState(false); // mostra se já está em modo "Obrigado" via query param

            // Ao montar, verifica se a URL tem ?enviado=1 (redirecionamento do FormSubmit)
            useEffect(() => {
                const qs = new URLSearchParams(window.location.search);
                if (qs.get('enviado') === '1') {
                    setSubmittedLocal(true);
                    // opcional: remover o param da URL sem reload
                    const url = new URL(window.location.href);
                    url.searchParams.delete('enviado');
                    window.history.replaceState({}, '', url.pathname);
                }
            }, []);

            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            // Submissão nativa: mantém comportamento de required nos inputs.
            // Não precisamos fazer fetch aqui; o <form> fará o POST para o FormSubmit.
            // Porém colocamos um pequeno handler para ativar o "loading" após submit nativo.
            const handleNativeSubmit = () => {
                setLoading(true);
                // Depois do POST, o FormSubmit redirecionará para _next (configurado abaixo).
            };

            if (submittedLocal) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
                            <svg className="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Avaliação Enviada!</h2>
                            <p className="text-gray-600 mb-6">Obrigado pelo seu feedback sobre o treinamento.</p>
                            <button
                                onClick={() => {
                                    setSubmittedLocal(false);
                                }}
                                className="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition"
                            >
                                Enviar Outra Avaliação
                            </button>
                        </div>
                    </div>
                );
            }

            // Ajuste: definimos o _next para redirecionar de volta para a URL atual + ?enviado=1
            // Usamos uma variável para inserir o value no input hidden abaixo via useEffect/diretamente aqui.
            const nextUrl = `${window.location.origin}${window.location.pathname}?enviado=1`;

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-8 mb-6">
                            <div className="border-b border-gray-200 pb-6 mb-6">
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">
                                    D Bauna - Avaliação de Treinamento
                                </h1>
                                <p className="text-lg text-indigo-600 font-semibold">Gestão e PDCA</p>
                                <p className="text-gray-600 mt-2">
                                    Sua opinião é fundamental para aprimorarmos nossos treinamentos
                                </p>
                            </div>

                            {/* FORM NATIVE: action -> FormSubmit */}
                            <form
                                action="https://formsubmit.co/el/xuyiwe"
                                method="POST"
                                onSubmit={handleNativeSubmit}
                                className="space-y-8"
                            >
                                {/* Campo para facilitar leitura do e-mail: message com texto formatado */}
                                <input type="hidden" name="message" value={
`D BAUNA - AVALIAÇÃO DE TREINAMENTO
GESTÃO E PDCA

Nome: ${formData.nomeParticipante}
Data do Treinamento: ${formData.dataAplicacao}
Clareza: ${formData.clareza}
Relevância: ${formData.relevancia}
Aplicabilidade: ${formData.aplicabilidade}
Metodologia: ${formData.metodologia}
PLAN: ${formData.compreensaoPlan}
DO: ${formData.compreensaoDo}
CHECK: ${formData.compreensaoCheck}
ACT: ${formData.compreensaoAct}
Instrutor: ${formData.instrutor}
Expectativas: ${formData.expectativas}
Aplicar Conhecimento: ${formData.aplicarConhecimento}
Recomendaria: ${formData.recomendaria}
Comentários: ${formData.comentarios || 'Não informado'}
Envio em: ${new Date().toLocaleString('pt-BR')}`
                                } />

                                {/* Campos ocultos do FormSubmit */}
                                <input type="hidden" name="_subject" value={`D Bauna - Avaliação - ${formData.nomeParticipante || 'Novo envio'}`} />
                                <input type="hidden" name="_captcha" value="false" />
                                <input type="hidden" name="_next" value={nextUrl} />

                                <section>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-indigo-500">
                                        Informações Gerais
                                    </h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Nome do Participante *
                                            </label>
                                            <input
                                                type="text"
                                                name="nomeParticipante"
                                                value={formData.nomeParticipante}
                                                onChange={handleChange}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Data do Treinamento *
                                            </label>
                                            <input
                                                type="date"
                                                name="dataAplicacao"
                                                value={formData.dataAplicacao}
                                                onChange={handleChange}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                required
                                            />
                                        </div>
                                    </div>
                                </section>

                                {/* ... resto dos campos mantém exatamente como antes ... */}
                                <section>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-indigo-500">
                                        1. Conteúdo do Treinamento
                                    </h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                A clareza do conteúdo apresentado foi: *
                                            </label>
                                            <select
                                                name="clareza"
                                                value={formData.clareza}
                                                onChange={handleChange}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                required
                                            >
                                                <option value="">Selecione...</option>
                                                <option value="Excelente (5)">Excelente</option>
                                                <option value="Muito Bom (4)">Muito Boa</option>
                                                <option value="Bom (3)">Boa</option>
                                                <option value="Regular (2)">Regular</option>
                                                <option value="Insatisfatório (1)">Insatisfatória</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                A relevância do conteúdo para sua atuação profissional: *
                                            </label>
                                            <select
                                                name="relevancia"
                                                value={formData.relevancia}
                                                onChange={handleChange}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                required
                                            >
                                                <option value="">Selecione...</option>
                                                <option value="Excelente (5)">Excelente</option>
                                                <option value="Muito Bom (4)">Muito Boa</option>
                                                <option value="Bom (3)">Boa</option>
                                                <option value="Regular (2)">Regular</option>
                                                <option value="Insatisfatório (1)">Insatisfatória</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                A aplicabilidade prática do conteúdo na sua rotina: *
                                            </label>
                                            <select
                                                name="aplicabilidade"
                                                value={formData.aplicabilidade}
                                                onChange={handleChange}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                required
                                            >
                                                <option value="">Selecione...</option>
                                                <option value="Excelente (5)">Excelente</option>
                                                <option value="Muito Bom (4)">Muito Boa</option>
                                                <option value="Bom (3)">Boa</option>
                                                <option value="Regular (2)">Regular</option>
                                                <option value="Insatisfatório (1)">Insatisfatória</option>
                                            </select>
                                        </div>
                                    </div>
                                </section>

                                {/* restante dos sections — mantenha exatamente como no seu original, 
                                    assegurando que name="" esteja definido (já está no seu código original) */}
                                {/* Para poupar repetição, usei ... no exemplo; ao colar, mantenha os outros selects e textarea como antes. */}

                                <section>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-indigo-500">
                                        6. Comentários e Sugestões
                                    </h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Comentários adicionais
                                            </label>
                                            <textarea
                                                name="comentarios"
                                                value={formData.comentarios}
                                                onChange={handleChange}
                                                rows="5"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="Compartilhe suas sugestões, pontos fortes do treinamento ou qualquer outro comentário..."
                                            />
                                        </div>
                                    </div>
                                </section>

                                <div className="pt-6 border-t border-gray-200">
                                    <button
                                        type="submit"
                                        className={`w-full ${loading ? 'bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700'} text-white py-3 px-6 rounded-lg font-semibold transition-colors shadow-lg hover:shadow-xl`}
                                    >
                                        {loading ? 'Enviando...' : 'Enviar Avaliação'}
                                    </button>
                                </div>
                            </form>
                        </div>

                        <p className="text-center text-gray-600 text-sm">
                            Suas respostas são confidenciais e serão usadas apenas para melhoria contínua
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FormularioTreinamento />, document.getElementById('root'));
    </script>
</body>
</html>
